name: Atualizar dados da planilha

# Copia a planilha do Google para data/dados.json, para o site ter uma fonte
# no mesmo domínio (sem CORS). Roda a cada 30 minutos e também sob demanda.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar leitor de planilha
        run: pip install openpyxl

      - name: Baixar a planilha e gerar data/dados.json
        env:
          API_URL: "https://script.google.com/macros/s/AKfycbyVpUQ8Wy_Hjz5c6X63F-6H11TLa31LUJDDQ1xwKAFwHIBKdnJuHY1mjq0_FLbPnghTlw/exec"
          PLANILHA_PUBLICADA_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7-JA1SfYMGei5qJcPNDMMGiO5zONhgdJ1YPCWltni253zeRRm-6_b73c8MswSaipsCL9rPORgWbeS/pubhtml"
        run: python scripts/atualizar_dados.py

      - name: Salvar no repositório (só se mudou)
        run: |
          if [ -z "$(git status --porcelain -- data/dados.json)" ]; then
            echo "Nada mudou."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dados.json
            git commit -m "Atualiza dados da planilha"
            git push
          fi
